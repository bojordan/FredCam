name: FredCam
options:
  bundleIdPrefix: com.bojordan
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"

packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    from: "2.2.0"

targets:
  FredCam:
    type: application
    platform: iOS
    sources:
      - FredCam
    settings:
      base:
        INFOPLIST_FILE: FredCam/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bojordan.FredCam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING: "YES"
      debug:
        VALIDATE_EMBEDDED_BINARY_BUNDLE_IDENTIFIER: "NO"
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    postBuildScripts:
      - name: Fix Embedded Framework Bundle Identifiers
        script: |
          find "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}" -name "*.framework" -maxdepth 1 | while read framework; do
            plist="$framework/Info.plist"
            if [ -f "$plist" ]; then
              bundle_id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$plist" 2>/dev/null)
              fixed_id=$(echo "$bundle_id" | tr '_' '-')
              if [ "$bundle_id" != "$fixed_id" ]; then
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $fixed_id" "$plist"
              fi
            fi
          done
        runOnlyWhenInstalling: false
        showEnvVars: false
